name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m compileall -q openpath tests
      - name: Unit + conformance (readiness gate)
        run: OPENPATH_LIVE=0 python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Live host smoke (read-only, against the runner)
        run: python -m unittest tests.live.test_live_host -v
